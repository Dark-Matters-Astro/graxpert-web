version: 2
updates:
- package-ecosystem: npm
  directory: "/"
  schedule:
    interval: daily
    time: '20:00'
  open-pull-requests-limit: 10
# Docsy theme (Hugo module). After merging an update, run `hugo mod npm pack`
# and `npm install`, then commit packages/hugoautogen.
- package-ecosystem: gomod
  directory: "/"
  schedule:
    interval: weekly
- package-ecosystem: github-actions
  directory: "/"
  schedule:
    interval: weekly
